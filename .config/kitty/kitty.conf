#: Theme Settings
include ./themes/macchiato.conf
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         angled
tab_title_template          {index}.{fmt.bold}{tab.active_exe} 

#: Font Settings
font_family      FiraCode Nerd Font Propo
bold_font        FiraCode Nerd Font Propo Bold
bold_italic_font FiraCode Nerd Font Propo Bold Italic
font_size 16.0


#: Terminal Settings
enable_audio_bell yes
visual_bell_duration 0.5

#: Background Settings
background_opacity 1.0
background_blur 1
background_tint 1.0
dim_opacity 1

#: OS Settings
macos_titlebar_color #24273A
macos_thicken_font 0.75
text_composition_strategy legacy
macos_colorspace srgb
macos_custom_beam_cursor yes
# hide_window_decorations titlebar-and-corners

#: Cursor + Neovim integration
allow_remote_control yes
listen_on unix:/tmp/kitty
map cmd+l kitten scripts/toggle_right.py

#: Resize split panes (kitty has no mouse-drag; use ⌘+r then arrows, or these keys)
map ctrl+cmd+left  resize_window narrower
map ctrl+cmd+right resize_window wider
map ctrl+cmd+up    resize_window shorter
map ctrl+cmd+down  resize_window taller

adjust_line_height 2